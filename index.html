<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #141722;
            --accent-color: #ff6600; /* Bright Neon Orange */
            --accent-glow: rgba(255, 102, 0, 0.45);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
            max-width: 600px;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        header p {
            font-size: 1.1rem;
            color: #7d8594;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .section-title {
            color: var(--text-bright);
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 2px 8px -2px var(--accent-glow);
            padding-bottom: 8px;
            margin-top: 40px;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #282e3d;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--text-bright);
            font-size: 1.2rem;
        }

        .card p {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #7d8594;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #ff8533;
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 102, 0, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 60px;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: #565d6b;
            text-align: center;
            border-top: 1px solid #1c2130;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ WBJayce Hub ⚡</h1>
        <p>Your one-stop destination for the latest safe, standalone VR mod menus and tools.</p>
    </header>

    <main>
        <!-- CUSTOM CONTENT WILL GO HERE -->
    </main>

    <footer>
        <p>Disclaimer: Use mods at your own risk. We are not affiliated with Meta or any game developers.</p>
    </footer>

</body>
</html>
