<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(20, 23, 34, 0.6);
            --accent-color: #ffe3aa; 
            --accent-glow: rgba(255, 227, 170, 0.35);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
            --radius-lg: 24px;
            --radius-full: 9999px;
        }
/* SOCIAL SIDEBAR STYLING */
        .socials-sidebar {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 100;
        }

        .social-link {
            width: 45px;
            height: 45px;
            border-radius: var(--radius-full);
            background: var(--card-bg);
            border: 1px solid rgba(255, 227, 170, 0.1);
            color: var(--text-bright);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-link:hover {
            color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.1);
        }

        /* MAIN CONTAINER */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 227, 170, 0.15);
            border-radius: var(--radius-lg);
            padding: 30px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .profile-card h1 {
            color: var(--text-bright);
            margin: 0 0 10px;
            font-size: 2rem;
        }

        .profile-card p {
            margin: 0;
            font-size: 0.95rem;
        }

        /* MUSIC PLAYER */
        .music-player {
            position: fixed;
            bottom: 20px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 227, 170, 0.2);
            border-radius: var(--radius-full);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            z-index: 1000;
        }

        .play-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- OVERLAY -->
    <div id="enter-overlay" onclick="enterSite()">
        <div class="enter-text">Click to Enter</div>
    </div>

    <!-- SIDEBAR -->
    <div class="socials-sidebar">
        <a href="#" class="social-link"><i class="fa-brands fa-discord"></i></a>
        <a href="#" class="social-link"><i class="fa-brands fa-youtube"></i></a>
        <a href="#" class="social-link"><i class="fa-brands fa-github"></i></a>
    </div>

    <!-- MAIN HUB -->
    <div class="container">
        <div class="profile-card">
            <h1>WBJayce</h1>
            <p>Welcome to the official hub.</p>
        </div>
    </div>

    <!-- AUDIO -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="music-player">
        <button class="play-btn" onclick="toggleAudio()"><i id="music-icon" class="fa-solid fa-pause"></i></button>
        <span style="font-size: 0.85rem; color: var(--text-bright);">Background Audio</span>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const icon = document.getElementById('music-icon');

        function enterSite() {
            document.getElementById('enter-overlay').classList.add('hidden');
            audio.play().catch(() => {});
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                icon.className = 'fa-solid fa-pause';
            } else {
                audio.pause();
                icon.className = 'fa-solid fa-play';
            }
        }
    </script>
</body>
</html>
