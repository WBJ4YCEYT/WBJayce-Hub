<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #141722;
            --accent-color: #ff6600; /* Bright Neon Orange */
            --accent-glow: rgba(255, 102, 0, 0.45);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; /* Space so player bar doesn't block content */
        }

        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
            max-width: 600px;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        header p {
            font-size: 1.1rem;
            color: #7d8594;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .section-title {
            color: var(--text-bright);
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 2px 8px -2px var(--accent-glow);
            padding-bottom: 8px;
            margin-top: 40px;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #282e3d;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 5px 20px var(--accent-glow);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--text-bright);
            font-size: 1.2rem;
        }

        .card p {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #7d8594;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #ff8533;
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        /* 🎵 GUNS.LOL STYLE FLOATING MUSIC PLAYER BAR 🎵 */
        .audio-player-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 450px;
            background-color: rgba(20, 23, 34, 0.85);
            border: 1px solid var(--accent-color);
            box-shadow: 0 4px 25px var(--accent-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            box-sizing: border-box;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
        }

        .track-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .track-name {
            color: var(--text-bright);
            font-size: 1rem;
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: #282e3d;
            border-radius: 2px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        .controls-btn {
            background: var(--accent-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s;
        }

        .controls-btn:hover {
            background-color: #ff8533;
        }

        .controls-btn:active {
            transform: scale(0.92);
        }

        .controls-btn svg {
            fill: #000000;
            width: 16px;
            height: 16px;
        }

        footer {
            margin-top: 60px;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: #565d6b;
            text-align: center;
            border-top: 1px solid #1c2130;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ WBJayce Hub ⚡</h1>
        <p>One click away from getting banned🙃</p>
    </header>

    <main>
        <!-- META TAG SECTION -->
        <h2 class="section-title">Meta Tag</h2>
        <div class="grid">
            
            <div class="card">
                <div>
                    <h3>Meta tag- Nitro Client (OP)</h3>
                    <p>Download the latest Nitro Client menu for Meta Tag here.</p>
                </div>
                <a href="https://mediafire.com" class="btn btn-primary" target="_blank">Download</a>
            </div>

        </div>
    </main>

    <!-- 🎵 BACKGROUND AUDIO COMPONENT 🎵 -->
    <audio id="bgMusic" src="song.mp3" loop></audio>

    <!-- 🎵 FLOATING GUNS.LOL PLAYER BAR WIDGET 🎵 -->
    <div class="audio-player-bar">
        <div class="player-info">
            <p class="track-status" id="playerStatus">PAUSED</p>
            <p class="track-name" id="trackLabel">Eazy-E - No More Muthafuckas 🎧</p>
            <div class="progress-container" id="progressTrack">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <button class="controls-btn" id="playBtn">
            <!-- Play Button SVG -->
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <!-- Pause Button SVG -->
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

    <footer>
        <p>Disclaimer: Use mods at your own risk. We are not affiliated with Meta or any game developers.</p>
    </footer>

    <!-- 🕹️ LOGIC HANDLERS FOR MEDIA PLAYBACK -->
    <script>
        const audio = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const progressTrack = document.getElementById('progressTrack');
        const playerStatus = document.getElementById('playerStatus');

        function playAudioEngine() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.style.display = 'none';
                    pauseIcon.style.display = 'block';
                    playerStatus.innerText = 'PLAYING';
                }).catch(err => {
                    console.log("Autoplay context waiting for standard tap event trigger");
                });
            }
        }

        // Smoothly triggers music playback as soon as the user interacts with the page
        document.body.addEventListener('click', playAudioEngine, { once: true });

        // Toggles manually when clicking play/pause button directly
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playerStatus.innerText = 'PLAYING';
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playerStatus.innerText = 'PAUSED';
            }
        });
