<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(20, 23, 34, 0.6);
            --accent-color: #ffe3aa; 
            --accent-glow: rgba(255, 227, 170, 0.35);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #060709 0%, #0d0f14 50%, #151821 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 150px;
            overflow-x: hidden; user-select: none;
        }

        header { text-align: center; padding: 60px 20px 20px 20px; }
        header h1 { color: var(--text-bright); font-size: 3rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent-glow); }
        header p { font-size: 1.1rem; color: #636d80; }

        main { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
        .section-title { color: var(--text-bright); border-bottom: 2px solid var(--accent-color); padding-bottom: 8px; margin-top: 40px; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-top: 20px; }
        @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

        /* Fully Rounded Cards & Smooth Hover Scaling */
        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 227, 170, 0.08);
            border-radius: 24px;
            padding: 28px;
            display: flex; flex-direction: column; justify-content: space-between;
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.5s, box-shadow 0.5s;
        }
        .card:hover { transform: scale(1.06); border-color: var(--accent-color); box-shadow: 0 15px 35px var(--accent-glow); }
        .card h3 { margin: 0 0 10px 0; color: var(--text-bright); font-size: 1.3rem; }
        .card p { margin: 0 0 24px 0; font-size: 0.95rem; color: #737d8f; line-height: 1.6; }

        /* Fully Rounded Buttons */
        .btn { display: inline-block; text-align: center; text-decoration: none; padding: 14px 24px; font-size: 0.95rem; font-weight: 700; border-radius: 50px; transition: all 0.3s ease; cursor: pointer; }
        .btn-primary { background-color: var(--accent-color); color: #000000; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary:hover { background-color: #ffffff; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,255,255,0.4); }

        /* Draggable, Resizable Bubble Player */
        .audio-player-bar {
            position: fixed; bottom: 30px; left: calc(50% - 200px);
            width: 400px; height: 120px;
            background-color: rgba(15, 18, 28, 0.85);
            border: 1px solid var(--accent-color);
            box-shadow: 0 8px 32px var(--accent-glow);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; padding: 16px 22px;
            display: flex; flex-direction: column; justify-content: space-between;
            z-index: 9999; box-sizing: border-box; touch-action: none;
        }

        .player-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .track-details { overflow: hidden; width: 65%; }
        .track-status { font-size: 0.7rem; letter-spacing: 1.5px; color: var(--accent-color); margin: 0; font-weight: 800; }
        .track-name { color: var(--text-bright); font-size: 0.95rem; font-weight: 700; margin: 2px 0 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .volume-box { display: flex; align-items: center; width: 30%; gap: 6px; }
        .volume-box span { font-size: 0.8rem; color: var(--accent-color); }
        .volume-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; height: 4px; border-radius: 2px; }

        .player-bottom { display: flex; align-items: center; width: 100%; gap: 15px; margin-top: 4px; }
        .progress-container { flex-grow: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; position: relative; cursor: pointer; }
        .progress-bar { height: 100%; background: var(--accent-color); width: 0%; border-radius: 10px; }
        
        .controls-btn { background: var(--accent-color); border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 10px var(--accent-glow); flex-shrink: 0; }
        .controls-btn svg { fill: #000000; width: 14px; height: 14px; }

        .resize-handle { position: absolute; right: 6px; bottom: 6px; width: 14px; height: 14px; cursor: se-resize; border-right: 2px solid var(--accent-color); border-bottom: 2px solid var(--accent-color); border-bottom-right-radius: 4px; }
        .star-particle { position: fixed; pointer-events: none; color: var(--accent-color); font-size: 1.2rem; z-index: 10000; animation: fallFade 1s forwards linear; text-shadow: 0 0 8px var(--accent-glow); }
        @keyframes fallFade { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(60px) rotate(180deg) scale(0.2); opacity: 0; } }
    </style>
</head>
<body>

    <header>
        <h1>⚡ WBJayce Hub ⚡</h1>
        <p>One click away from getting banned🙃</p>
    </header>

    <main>
        <h2 class="section-title">Meta Tag</h2>
        <div class="grid">
            <div class="card">
                <div>
                    <h3>Meta tag- Nitro Client (OP)</h3>
                    <p>Download the latest Nitro Client menu for Meta Tag here.</p>
                </div>
                <a href="https://mediafire.com" class="btn btn-primary" target="_blank">Download</a>
            </div>
        </div>
    </main>

    <audio id="bgMusic" src="song.mp3" loop></audio>

    <!-- Draggable & Resizable Player Window -->
    <div class="audio-player-bar" id="dragPlayer">
        <div class="player-top">
            <div class="track-details">
                <p class="track-status" id="playerStatus">PAUSED</p>
                <p class="track-name">Eazy-E - No More Muthafuckas</p>
            </div>
            <div class="volume-box">
                <span>🔈</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
            </div>
        </div>
        <div class="player-bottom">
            <button class="controls-btn" id="playBtn">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <div class="progress-container" id="progressTrack">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <!-- Links up our background engine logic file safely -->
    <script src="script.js"></script>
</body>
</html>
