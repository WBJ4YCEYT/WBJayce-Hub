<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #060709;
            --card-bg: rgba(20, 23, 34, 0.6);
            --accent-color: #ffe3aa; 
            --accent-glow: rgba(255, 227, 170, 0.35);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
            --radius-lg: 24px;
            --radius-sm: 12px;
            --radius-full: 9999px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #060709 0%, #0d0f14 50%, #151821 100%);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 180px;
            overflow-x: hidden; user-select: none;
        }

        /* CLICK TO ENTER OVERLAY */
        #enter-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            cursor: pointer;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #enter-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-text {
            color: var(--text-bright);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--accent-glow);
            animation: pulse 1.5s infinite;
            background: rgba(20, 23, 34, 0.8);
            padding: 16px 32px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(255, 227, 170, 0.2);
            backdrop-filter: blur(10px);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.96); }
        }

        /* SOCIAL SIDEBAR STYLING */
        .socialsThat screen freeze usually happens when a keypress event fails to register with the operating system or the app's focus drops.

**Quick Troubleshooting Steps**

*   **Toggle Window Focus:** Click anywhere outside the application, then click directly back inside the prompt window before pressing **Enter**. Alternatively, press `Alt + Tab` (`Cmd + Tab` on Mac) away and back.
*   **Force an Alternative Key Input:** 
    *   Try **Spacebar** or the **Numpad Enter** key.
    *   Press `Shift + Enter` or `Ctrl + Enter`.
*   **Check On-Screen Keyboard:** Open your OS virtual keyboard (Accessibility settings) and click the **Enter** key to see if it bypasses a hardware mapping issue.
*   **Clear Input Buffers:** Press `Esc` a few times to cancel any background pop-ups or frozen UI overlays blocking the screen advance.
