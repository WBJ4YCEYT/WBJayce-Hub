<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #06070d;
            --card-bg: rgba(20, 23, 34, 0.65);
            --accent-color: #ffe3aa; 
            --accent-glow: rgba(255, 227, 170, 0.35);
            --text-color: #a0a7b5;
            --text-bright: #ffffff;
        }

        /* 🌌 IMMERSIVE COSMOS BACKGROUND LAYOUT */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 227, 170, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 227, 170, 0.03) 0%, transparent 40%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 140px; 
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            text-align: center;
            padding: 60px 20px 20px 20px;
            max-width: 600px;
            z-index: 2;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 3rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        header p {
            font-size: 1.1rem;
            color: #727985;
            background: rgba(255, 227, 170, 0.05);
            padding: 8px 24px;
            border-radius: 50px;
            display: inline-block;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 227, 170, 0.1);
        }

        main {
            width: 100%;
            max-width: 700px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2;
        }

        .section-title {
            color: var(--text-bright);
            padding-left: 10px;
            margin-top: 40px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 15px;
        }

        /* 🌟 HIGHLY ROUNDED SMOOTH HOVER CARD MODULE */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(40, 46, 61, 0.5);
            border-radius: 32px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1), border-color 0.4s, box-shadow 0.4s;
            transform-origin: center;
        }

        .card:hover {
            transform: scale(1.04) translateY(-2px); 
            border-color: var(--accent-color);
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        .card h3 {
            margin: 0 0 8px 0;
            color: var(--text-bright);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .card p {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #7e8694;
            line-height: 1.6;
        }

        /* 💊 PILL COMPACT BUTTON EMBEDDING */
        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 14px 28px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 50px;
            transition: background 0.3s, transform 0.1s, box-shadow 0.3s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #06070d;
            box-shadow: 0 4px 15px rgba(255, 227, 170, 0.2);
        }

        .btn-primary:hover {
            background-color: #ffffff;
            box-shadow: 0 8px 25px var(--accent-glow);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* 🎵 ADVANCED RESIZABLE & DRAGGABLE MEDIA BUBBLE */
        .audio-player-bar {
            position: fixed;
            bottom: 30px;
            left: calc(50% - 225px);
            width: 450px;
            min-width: 320px;
            min-height: 80px;
            background-color: rgba(14, 16, 24, 0.75);
            border: 1px solid rgba(255, 227, 170, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 35px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            box-sizing: border-box;
            cursor: move;
            touch-action: none;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
            pointer-events: none;
        }

        .track-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            margin: 0 0 3px 0;
            font-weight: 800;
        }

        .track-name {
            color: var(--text-bright);
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 50px;
        }

        /* 🎛️ CONTROLS & VOLUME ARRANGEMENTS */
        .controls-group {
            display: flex;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .volume-box {
            display: flex;
            align-items: center;
            width: 70px;
            transition: width 0.3s;
        }

        .volume-slider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 4px;
            border-radius: 50px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
        }

        .controls-btn {
            background: var(--accent-color);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 227, 170, 0.25);
            flex-shrink: 0;
        }

        .controls-btn svg {
            fill: #06070d;
            width: 16px;
            height: 16px;
        }

        /* 📐 RESIZE SCALE HANDLE CORNER */
        .resize-handle {
            position: absolute;
            right: 4px;
            bottom: 4px;
            width: 14px;
            height: 14px;
            cursor: se-resize;
            pointer-events: auto;
            background: linear-gradient(135deg, transparent 40%, var(--accent-color) 40%);
            border-bottom-right-radius: 8px;
            opacity: 0.5;
        }

        /* ✨ STARFIELD FLOATING PARTICLES */
        .star-particle {
            position: fixed;
            pointer-events: none;
            color: var(--accent-color);
            font-size: 1rem;
            z-index: 10000;
            animation: fallFade 1.2s forwards linear;
        }

        @keyframes fallFade {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            40% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(60px) rotate(140deg) scale(0.2);
                opacity: 0;
            }
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            font-size: 0.85rem;
            color: #494f5c;
            text-align: center;
            width: 100%;
            z-index: 2;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ WBJayce Hub ⚡</h1>
        <p>One click away from getting banned🙃</p>
    </header>

    <main>
        <!-- META TAG SECTION -->
        <h2 class="section-title">Meta Tag</h2>
        <div class="grid">
            <div class="card">
                <div>
                    <h3>Meta tag- Nitro Client (OP)</h3>
                    <p>Download the latest Nitro Client menu for Meta Tag here.</p>
                </div>
                <a href="https://mediafire.com" class="btn btn-primary" target="_blank">Download</a>
            </div>
        </div>
    </main>
