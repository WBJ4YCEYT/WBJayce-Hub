<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #050608;
            --card-bg: rgba(20, 23, 34, 0.65);
            --accent-color: #ffe3aa; 
            --accent-glow: rgba(255, 227, 170, 0.35);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
            --panel-radius: 24px;   /* Ultra-rounded panel corners */
            --button-radius: 30px;  /* Fully pill-shaped rounded buttons */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 160px; 
            overflow-x: hidden;
            user-select: none;
            position: relative;
            min-height: 100vh;
        }

        /* 🌌 CYBERPUNK AMBIENT BACKGROUND GLOW MATRIX */
        .bg-glow-matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(255, 227, 170, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 70%, rgba(255, 227, 170, 0.06) 0%, transparent 45%);
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        header {
            text-align: center;
            padding: 60px 20px 30px 20px;
            max-width: 600px;
            z-index: 10;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 3rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        header p {
            font-size: 1.15rem;
            color: #7d8594;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.02);
            padding: 8px 20px;
            border-radius: var(--button-radius);
            border: 1px solid rgba(255,255,255,0.05);
            display: inline-block;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }

        .section-title {
            color: var(--text-bright);
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 4px 12px -4px var(--accent-glow);
            padding-bottom: 10px;
            margin-top: 40px;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            margin-top: 24px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 🌟 GLASSMORPHISM CARDS WITH SMOOTH SCALING SCULPTING */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 227, 170, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: var(--panel-radius);
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s, box-shadow 0.4s;
            transform-origin: center center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card:hover {
            transform: scale(1.05); 
            border-color: var(--accent-color);
            box-shadow: 0 15px 35px var(--accent-glow);
        }

        .card h3 {
            margin: 0 0 12px 0;
            color: var(--text-bright);
            font-size: 1.3rem;
            font-weight: 700;
        }

        .card p {
            margin: 0 0 28px 0;
            font-size: 0.95rem;
            color: #8a92a3;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 14px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: var(--button-radius);
            transition: background 0.3s, transform 0.1s, box-shadow 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #050608;
            box-shadow: 0 6px 20px rgba(255, 227, 170, 0.25);
        }

        .btn-primary:hover {
            background-color: #fff2d4;
            box-shadow: 0 8px 25px var(--accent-glow);
            transform: translateY(-1px);
        }

        /* 🎵 PREMIUM SMART INTERACTIVE DRAGGABLE & RESIZABLE PLAYER BAR */
        .audio-player-bar {
            position: fixed;
            bottom: 30px;
            left: calc(50% - 225px); 
            width: 450px;
            min-width: 320px;
            max-width: 90vw;
            background-color: rgba(13, 15, 22, 0.75);
            border: 1px solid rgba(255, 227, 170, 0.25);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 227, 170, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            box-sizing: border-box;
            cursor: grab;
            touch-action: none;
        }

        .audio-player-bar:active {
            cursor: grabbing;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
            pointer-events: none;
        }

        .track-status {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-color);
            margin: 0 0 3px 0;
            font-weight: 800;
            opacity: 0.9;
        }

        .track-name {
            color: var(--text-bright);
            font-size: 0.95rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 🎚️ MIXER CONSOLE TIMELINE AND VOLUME SLIDERS */
        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            position: relative;
            pointer-events: auto;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 10px;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* 🔊 VOLUME MANAGEMENT SLIDER INTERFACE */
        .volume-container {
            display: flex;
            align-items: center;
            margin-left: 12px;
            pointer-events: auto;
            gap: 8px;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 6px var(--accent-color);
            cursor: pointer;
        }

        .volume-icon svg {
            fill: var(--accent-color);
            width: 14px;
            height: 14px;
            display: block;
        }

        .controls-btn {
            background: var(--accent-color);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 227, 170, 0.2);
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s, box-shadow 0.2s;
            pointer-events: auto;
        }

        .controls-btn:hover {
            background-color: #fff2d4;
            box-shadow: 0 6px 15px var(--accent-glow);
        }

        .controls-btn:active {
            transform: scale(0.9);
        }

        .controls-btn svg {
            fill: #050608;
            width: 16px;
            height: 16px;
        }

        /* 📐 DRAG-RESIZE CORNER INTERFACE HINT ELEMENT */
        .resize-handle {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 14px;
            height: 14px;
            cursor: se-resize;
            background: linear-gradient(135deg, transparent 40%, var(--accent-color) 40%);
            border-bottom-right-radius: 20px;
            opacity: 0.4;
            transition: opacity 0.2s;
            pointer-events: auto;
            z-index: 100;
        }
