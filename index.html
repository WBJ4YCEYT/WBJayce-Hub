<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBJayce Hub</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #141722;
            --accent-color: #ffe3aa; /* Orange Theme color #ffe3aa */
            --accent-glow: rgba(255, 227, 170, 0.45);
            --text-color: #abb2bf;
            --text-bright: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 120px; 
            overflow-x: hidden;
            user-select: none;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
            max-width: 600px;
        }

        header h1 {
            color: var(--text-bright);
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--accent-glow);
        }

        header p {
            font-size: 1.1rem;
            color: #7d8594;
        }

        main {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .section-title {
            color: var(--text-bright);
            border-bottom: 2px solid var(--accent-color);
            box-shadow: 0 2px 8px -2px var(--accent-glow);
            padding-bottom: 8px;
            margin-top: 40px;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* 🌟 SMOOTH EXPANDING CARDS 🌟 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid #282e3d;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s;
            transform-origin: center center;
        }

        .card:hover {
            transform: scale(1.05); 
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .card h3 {
            margin: 0 0 10px 0;
            color: var(--text-bright);
            font-size: 1.2rem;
        }

        .card p {
            margin: 0 0 24px 0;
            font-size: 0.95rem;
            color: #7d8594;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn-primary:hover {
            background-color: #fff2d4;
            box-shadow: 0 6px 18px var(--accent-glow);
        }

        /* 🎵 DRAGGABLE GUNS.LOL PLAYER BAR WIDGET 🎵 */
        .audio-player-bar {
            position: fixed;
            bottom: 20px;
            left: calc(50% - 225px); /* Center it by default horizontally */
            width: calc(100% - 40px);
            max-width: 450px;
            background-color: rgba(20, 23, 34, 0.85);
            border: 1px solid var(--accent-color);
            box-shadow: 0 4px 25px var(--accent-glow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 14px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 9999;
            box-sizing: border-box;
            cursor: move; /* Indicates it can be moved around */
            touch-action: none; /* Stops normal phone/VR screen scrolling while moving */
        }

        .player-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            margin-right: 15px;
            overflow: hidden;
            pointer-events: none; /* Helps drag detection ignore inner text elements */
        }

        .track-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin: 0 0 2px 0;
            font-weight: 700;
        }

        .track-name {
            color: var(--text-bright);
            font-size: 1rem;
            font-weight: bold;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: #282e3d;
            border-radius: 2px;
            position: relative;
            pointer-events: auto; /* Keeps progress timeline clickable */
        }

        .progress-bar {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            border-radius: 2px;
        }

        .controls-btn {
            background: var(--accent-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            flex-shrink: 0;
            transition: transform 0.1s, background-color 0.2s;
            pointer-events: auto; /* Keeps control button interactive */
        }

        .controls-btn:hover {
            background-color: #fff2d4;
        }

        .controls-btn:active {
            transform: scale(0.92);
        }

        .controls-btn svg {
            fill: #000000;
            width: 16px;
            height: 16px;
        }

        /* ✨ STAR TRAIL STYLING ✨ */
        .star-particle {
            position: fixed;
            pointer-events: none;
            color: var(--accent-color);
            font-size: 1.2rem;
            z-index: 10000;
            animation: fallFade 1s forwards linear;
            text-shadow: 0 0 5px var(--accent-glow);
        }

        @keyframes fallFade {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(50px) rotate(180deg) scale(0.3);
                opacity: 0;
            }
        }

        footer {
            margin-top: 60px;
            padding: 30px 20px;
            font-size: 0.85rem;
            color: #565d6b;
            text-align: center;
            border-top: 1px solid #1c2130;
            width: 100%;
        }
    </style>
</head>
